# Opens pull requests when Gradle, the libraries in gradle/libs.versions.toml or the GitHub
# Actions have new versions. The web workflow builds and tests each one, merges it when everything
# passes and leaves a broken update open.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Small updates together in one pull request, big ones on their own
      libraries:
        update-types: [minor, patch]
    ignore:
      # Material 3 1.13 needs Compose Multiplatform 1.13: with 1.12 the web app fails to start
      # (skiko.mjs misses functions). Update both together by hand
      - dependency-name: "org.jetbrains.compose.material3:*"
        versions: ["[1.13.0-alpha,)"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
