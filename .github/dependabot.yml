# Opens pull requests when Gradle, the libraries in gradle/libs.versions.toml or the GitHub
# Actions have new versions. The web workflow builds and tests each one, merges it when everything
# passes and leaves a broken update open.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Material 3 needs the Compose Multiplatform of the same version: Material 3 1.13 with
      # Compose 1.12 makes the web app fail to start (skiko.mjs misses functions). Dependabot can't
      # match versions, but together the browser check keeps this pull request open until both fit.
      # Before "libraries" because a dependency goes in the first group it matches
      compose:
        patterns: ["org.jetbrains.compose*"]
      # Small updates together in one pull request, big ones on their own
      libraries:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
