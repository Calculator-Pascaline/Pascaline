# Builds the web app and publishes it on GitHub Pages:
# https://calculator-pascaline.github.io/Pascaline/
# Pushes and pull requests (like Dependabot updates) are built for Android and the web and tested,
# only pushes are published, and only when everything passes. Every build starts the web app in a
# browser to check that it works. A Dependabot pull request that passes is merged, then the web app
# is published.
name: Web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, a newer push replaces the one that is still building. Pull requests
# have their own group so that they never cancel a deployment
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # Optimizing WebAssembly takes a while
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Android app
        run: ./gradlew :androidApp:assembleDebug

      - name: Run tests
        run: ./gradlew testAndroidHostTest :kt-math:jvmTest

      # They need a device to run, but compiling them catches code changes that break them
      - name: Compile tests for devices
        run: ./gradlew compileAndroidDeviceTest

      # Code checks (detekt/config.yml): new findings fail, the known ones are in detekt/baseline.xml
      - name: Check code with Detekt
        run: ./gradlew detektProjectReport

      # The shared tests again on the web's code, in Firefox (installed on the runner): the web app
      # computes with its own number library, which can differ from Android's
      - name: Run tests in a browser
        run: ./gradlew wasmJsBrowserTest --continue

      - name: Build web app
        run: ./gradlew :sharedApp:wasmJsBrowserDistribution

      # Android checks can't see errors that only happen in the browser. Starting the app in
      # Chromium stops a broken update before it's merged or published
      - name: Start web app in a browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python .github/scripts/smoke_test.py sharedApp/build/dist/wasmJs/productionExecutable

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: sharedApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot updates that build and pass every test are merged without waiting for a review.
  # A merge made by a workflow doesn't start the push build, so this one asks for it
  merge-dependabot:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge pull request
        run: gh pr merge --squash --delete-branch "${{ github.event.pull_request.number }}"

      - name: Publish web app
        run: gh workflow run web.yml --ref main
