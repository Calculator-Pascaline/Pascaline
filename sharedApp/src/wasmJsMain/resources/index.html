<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pascaline | Calculator</title>
    <meta
      name="description"
      content="Pascaline: a scientific calculator with exact results, fractions, functions, statistics and a unit converter."
    />
    <meta name="theme-color" content="#2F5DA8" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link type="text/css" rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <script>
      // Works offline once loaded, and can be installed like an app
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
      }
    </script>
    <script type="application/javascript" src="sharedApp.js"></script>
  </head>
  <body>
    <div class="loading-container">
      <div class="loading-text">Pascaline is loading…</div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </body>
</html>
