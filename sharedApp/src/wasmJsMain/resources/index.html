<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pascaline | Calculator</title>
    <meta
      name="description"
      content="Pascaline: a scientific calculator with exact results, fractions, functions, statistics and a unit converter."
    />
    <meta name="theme-color" content="#2F5DA8" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link type="text/css" rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <script>
      // Works offline once loaded, and can be installed like an app. Files are saved for offline use
      // a while after the app has started: on phones, doing both at once can use too much memory
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          // Never sw.js from the browser's cache: a new release is found on the next visit
          setTimeout(() => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }), 15000),
        );
      }

      // Safari can drop big downloads partway, and nothing else tries again. Each .wasm file comes
      // whole, one at a time, and a dropped one starts over. A file that works isn't touched
      const fetchFile = window.fetch.bind(window);
      let wasmDownloads = Promise.resolve();
      let wasmRetries = 0;
      async function fetchWhole(input, init) {
        for (let attempt = 1; ; attempt++) {
          try {
            const response = await fetchFile(input, attempt > 1 ? { ...init, cache: "no-store" } : init);
            if (!response.ok) return response;
            return new Response(await response.arrayBuffer(), { headers: { "Content-Type": "application/wasm" } });
          } catch (error) {
            if (attempt > WASM_RETRIES) throw error;
            wasmRetries++;
            await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
          }
        }
      }
      const WASM_RETRIES = 4;
      window.fetch = (input, init) => {
        const url = String(input instanceof Request ? input.url : input).split("?")[0];
        if (!url.endsWith(".wasm")) return fetchFile(input, init);
        const download = wasmDownloads.then(() => fetchWhole(input, init));
        wasmDownloads = download.catch(() => {});
        return download;
      };

      // Errors show what went wrong instead of a white page: the first few, the first one is often
      // only a consequence
      const startErrors = [];
      function describe(value) {
        if (value instanceof Error) return value.name + ": " + value.message + "\n" + (value.stack || "");
        if (typeof WebAssembly !== "undefined" && value instanceof WebAssembly.Exception) {
          return "WebAssembly exception " + (value.stack || "");
        }
        return String(value);
      }
      // Safari can fail to load the app through an offline copy. Online, that copy is dropped and
      // the page loads once more without it. Once only, a real error must stay visible
      function retryWithoutOfflineCopy(text) {
        if (!/Load failed/.test(text) || !navigator.onLine) return false;
        try {
          if (sessionStorage.getItem("retried-without-offline-copy")) return false;
          sessionStorage.setItem("retried-without-offline-copy", "true");
        } catch (e) {
          return false;
        }
        const registrations = "serviceWorker" in navigator ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
        registrations
          .then((list) => Promise.all(list.map((registration) => registration.unregister())))
          .then(() => ("caches" in window ? caches.keys() : []))
          .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          .catch(() => {})
          .then(() => location.reload());
        return true;
      }
      // What the browser knows about the app's biggest files: a blocked download or a slow one
      function loadDetails() {
        const seconds = (performance.now() / 1000).toFixed(1);
        const files = performance
          .getEntriesByType("resource")
          .filter((entry) => entry.name.endsWith(".wasm"))
          .map((entry) => entry.name.split("/").pop().slice(0, 6) + " " + Math.round(entry.duration) + " ms " + entry.encodedBodySize + " b");
        const source = "serviceWorker" in navigator && navigator.serviceWorker.controller ? "offline copy" : "network";
        return [seconds + " s, " + source + ", " + wasmRetries + " retries" + (navigator.onLine ? "" : ", offline"), ...files].join("\n");
      }
      function showStartError(reason) {
        const text = String(reason).slice(0, 400);
        if (retryWithoutOfflineCopy(text)) return;
        if (startErrors.length >= 5 || startErrors.includes(text)) return;
        startErrors.push(text);
        let box = document.getElementById("start-error");
        if (!box) {
          box = document.createElement("div");
          box.id = "start-error";
          box.className = "start-error";
          box.innerHTML =
            "<b>Something went wrong</b><p>Please report this on GitHub with your device and browser:</p><code></code>";
          const link = document.createElement("a");
          link.href = "https://github.com/Calculator-Pascaline/Pascaline/issues/new";
          link.textContent = "Report the problem";
          box.appendChild(link);
          // Not in body: the app puts its own content there and hides the rest
          document.documentElement.appendChild(box);
        }
        box.querySelector("code").textContent = startErrors.concat(loadDetails()).join("\n\n");
      }
      // The app reports some of its errors only to the console
      const consoleError = console.error.bind(console);
      console.error = (...args) => {
        consoleError(...args);
        const text = args.map(describe).join(" ");
        // Warnings about old ways of doing things are not errors
        if (/deprecated/i.test(text)) return;
        showStartError(text);
      };
      window.addEventListener("error", (e) =>
        showStartError(
          (e.error ? describe(e.error) : e.message) +
            (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ":" + e.colno + ")" : ""),
        ),
      );
      window.addEventListener("unhandledrejection", (e) => showStartError(describe(e.reason)));
      document.addEventListener(
        "webglcontextlost",
        () => showStartError("Graphics were stopped by the browser (WebGL context lost)"),
        true,
      );
    </script>
    <script type="application/javascript" src="sharedApp.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="loading-container">
      <div class="loading-text">Pascaline is loading…</div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </body>
</html>
